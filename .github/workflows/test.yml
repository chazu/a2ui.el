name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ["29.1", "29.4", "30.1", "snapshot"]
    steps:
      - uses: actions/checkout@v4
      - uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}
      - uses: emacs-eldev/setup-eldev@v1
      - name: Compile
        run: eldev -p -dtT compile --warnings-as-errors
      - name: Test
        run: eldev -p -dtT test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jcs090218/setup-emacs@master
        with:
          version: "30.1"
      - uses: emacs-eldev/setup-eldev@v1
      - name: package-lint
        run: eldev -p -dtT lint package
      - name: checkdoc
        run: eldev -p -dtT lint doc
